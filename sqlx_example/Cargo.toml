[package]
name = "sqlx_example"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.58"
sqlx = { version = "0.9.0", features = [ "postgres", "runtime-tokio", "tls-native-tls" ] }
clap = { version = "4.4.7", features = ["derive"] }
tokio = { version = "1.25.0", features = ["rt", "macros"]}
dotenvy = "0.15.7"
